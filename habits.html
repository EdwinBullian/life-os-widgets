<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habits — 28 Day</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#191919;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;padding:12px 14px}

  .wrap{display:flex;flex-direction:column;gap:9px;width:100%}
  .head{display:flex;align-items:center;justify-content:space-between}
  .title{font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:#a8a8a8}
  .sub{font-size:9.5px;color:rgba(255,255,255,0.32);letter-spacing:.4px}

  /* 4 x 7 — each row a rolling week, newest bottom-right */
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{aspect-ratio:1;border-radius:4px;background:#242424;border:1px solid rgba(255,255,255,0.05);cursor:default;transition:transform .12s}
  .cell:hover{transform:scale(1.12)}
  .cell.l1{background:#2c5d3a}
  .cell.l2{background:#357a49}
  .cell.l3{background:#41a85f}
  .cell.l4{background:#4ade80;border-color:rgba(74,222,128,0.3)}
  .cell.nodata{background:transparent;border:1px dashed rgba(255,255,255,0.08)}
  .cell.today{box-shadow:0 0 0 1.5px rgba(226,201,126,0.75)}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.07)}
  .today-count{font-size:10px;color:rgba(255,255,255,0.4)}
  .today-count b{color:#e0e0e0;font-weight:700}
  .streak{display:flex;align-items:center;gap:5px}
  .flame{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:20px;line-height:1}
  .flame-n{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:900;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;letter-spacing:-.5px}
  .streak-lbl{font-size:9.5px;color:rgba(255,255,255,0.4)}

  .tip{position:fixed;background:#1c2128;border:1px solid #444c56;border-radius:6px;padding:6px 10px;font-size:11px;color:#e6edf3;pointer-events:none;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.6);line-height:1.5}
  .tip b{font-weight:700}
  .tip .d{color:rgba(255,255,255,0.45);font-size:10px}

  #liveStatus{position:fixed;bottom:3px;right:8px;font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:.5px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><span class="title">🔥 HABITS</span><span class="sub">last 28 days</span></div>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <span class="today-count" id="todayCount"></span>
      <span class="streak"><span class="flame">🔥<span class="flame-n" id="flameN">0</span></span><span class="streak-lbl">day streak</span></span>
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <div id="liveStatus">loading…</div>

  <script>
    // Reads the EXISTING habits.json shape: { habits: { "YYYY-MM-DD": percent 0-100, -1 = unlogged }, streak, totalHabits, updated }
    const REFRESH = 15 * 60 * 1000;
    const DAYS = 28;
    const PERFECT = 100; // a "perfect day" for streak purposes

    function keyOf(dt){const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
    function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}

    // Seed / fallback demo in the same percent format (only used if fetch fails, e.g. local preview)
    function demoMap(){
      const pct=[88,62,100,88,75,88,100, 88,75,50,88,100,88,75, 100,88,100,100,75,88,100, 100,88,75,100,100,88,-1];
      const base=today0(),m={};
      for(let i=0;i<DAYS;i++){const dt=new Date(base);dt.setDate(base.getDate()-(DAYS-1-i));m[keyOf(dt)]=pct[i];}
      return m;
    }

    const tip=document.getElementById("tip");
    function showTip(el,html){el.addEventListener("mouseenter",()=>{tip.innerHTML=html;tip.style.display="block";});
      el.addEventListener("mousemove",e=>{tip.style.left=(e.clientX+13)+"px";tip.style.top=(e.clientY-8)+"px";});
      el.addEventListener("mouseleave",()=>tip.style.display="none");}

    function bucket(p){ if(p<0||p==null)return"nodata"; if(p>=PERFECT)return"l4"; if(p>=85)return"l3"; if(p>=60)return"l2"; if(p>0)return"l1"; return""; }

    function render(habits){
      const base=today0(),tkey=keyOf(base);
      const grid=document.getElementById("grid");grid.innerHTML="";
      const dates=[];for(let i=0;i<DAYS;i++){const dt=new Date(base);dt.setDate(base.getDate()-(DAYS-1-i));dates.push(dt);}

      dates.forEach(dt=>{
        const k=keyOf(dt);
        const p=(k in habits)?habits[k]:null;
        const cell=document.createElement("div");
        cell.className="cell "+bucket(p)+(k===tkey?" today":"");
        const nice=dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
        const val=(p==null||p<0)?"—":p+"%";
        showTip(cell,`<b>${val}</b><br><span class="d">${nice}${k===tkey?" · today":""}</span>`);
        grid.appendChild(cell);
      });

      // streak: consecutive perfect days ending at the latest logged day (today skipped if unlogged)
      let streak=0;
      for(let i=DAYS-1;i>=0;i--){
        const k=keyOf(dates[i]);
        const p=(k in habits)?habits[k]:null;
        if(k===tkey && (p==null||p<0)) continue; // today not logged yet → don't break
        if(p!=null && p>=PERFECT) streak++; else break;
      }
      document.getElementById("flameN").textContent=streak;

      const tp=(tkey in habits)?habits[tkey]:null;
      document.getElementById("todayCount").innerHTML = (tp==null||tp<0) ? `Today <b>—</b>` : `Today <b>${tp}%</b>`;
    }

    function setStatus(txt,col){const el=document.getElementById("liveStatus");el.textContent=txt;if(col)el.style.color=col;}

    async function load(){
      try{
        const r=await fetch("./habits.json?t="+Date.now());
        if(!r.ok) throw new Error("no json");
        const j=await r.json();
        render(j.habits||{});
        const d=j.updated?new Date(j.updated*1000):new Date();
        setStatus("synced "+d.toLocaleDateString(),"rgba(74,222,128,0.35)");
      }catch{
        render(demoMap());
        setStatus("offline · seed data","rgba(255,255,255,0.15)");
      }
    }
    load();
    setInterval(load, REFRESH);
  </script>
</body>
</html>

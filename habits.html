<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habits — 7 Day</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#191919;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;padding:11px 13px}

  .wrap{position:relative;display:flex;flex-direction:column;gap:7px;width:100%}
  .head{display:flex;align-items:center;justify-content:space-between}
  .title{font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:#a8a8a8}
  .sort{font-size:9px;color:rgba(255,255,255,0.32);letter-spacing:.4px;cursor:pointer;border:1px solid rgba(255,255,255,0.10);border-radius:4px;padding:1.5px 6px;white-space:nowrap}
  .sort:hover{color:#d0d0d0;border-color:rgba(255,255,255,0.28)}

  /* one row per habit: name | 7 day dots | rate */
  .rows{display:flex;flex-direction:column;gap:3px}
  .row{display:grid;grid-template-columns:66px 1fr 34px;align-items:center;gap:8px;height:17px}
  .row.hdr{height:11px;margin-bottom:1px}

  .nm{font-size:10px;color:#c9c9c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
  .row.hdr .nm{font-size:8.5px;color:rgba(255,255,255,0.28);letter-spacing:.7px}

  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .d{aspect-ratio:1;max-height:15px;border-radius:3.5px;background:#242424;border:1px solid rgba(255,255,255,0.05)}
  .d.on{background:#41a85f;border-color:rgba(74,222,128,0.28)}
  .d.off{background:#3a2326;border-color:rgba(248,113,113,0.16)}
  .d.none{background:transparent;border:1px dashed rgba(255,255,255,0.09)}
  .d.today{box-shadow:0 0 0 1.5px rgba(226,201,126,0.6)}
  .days.hdr-days{align-items:end}
  .dl{font-size:8px;text-align:center;color:rgba(255,255,255,0.26);letter-spacing:.2px}
  .dl.is-today{color:rgba(226,201,126,0.75)}

  .rate{font-size:10.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .rate.good{color:#4ade80}
  .rate.mid{color:#e2c97e}
  .rate.bad{color:#f87171}
  .rate.na{color:rgba(255,255,255,0.22);font-weight:500}
  .row.hdr .rate{font-size:8.5px;color:rgba(255,255,255,0.28);font-weight:600;letter-spacing:.5px}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;margin-top:1px;border-top:1px solid rgba(255,255,255,0.07)}
  .overall{font-size:10px;color:rgba(255,255,255,0.4);white-space:nowrap}
  .overall b{color:#e0e0e0;font-weight:700}
  .weak{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .weak b{color:#f87171;font-weight:700}

  .tip{position:fixed;background:#1c2128;border:1px solid #444c56;border-radius:6px;padding:6px 10px;font-size:11px;color:#e6edf3;pointer-events:none;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.6);line-height:1.5}
  .tip b{font-weight:700}
  .tip .s{color:rgba(255,255,255,0.45);font-size:10px}

  #liveStatus{position:fixed;bottom:3px;right:8px;font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:.5px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="title">🔥 HABITS · 7D</span>
      <span class="sort" id="sortBtn">worst first</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="foot">
      <span class="overall" id="overall"></span>
      <span class="weak" id="weak"></span>
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <div id="liveStatus">loading…</div>

  <script>
    // Reads habits.json: { habits:{date:pct}, details:{date:{habit:bool}}, streaks:{habit:days}, totalHabits, updated }
    // Per-habit success rate over the trailing 7 days is derived from `details` — no schema change needed.
    const REFRESH = 15 * 60 * 1000;
    const DAYS = 7;
    const HABIT_ORDER = ["10k Steps","Lift","Calories","Clean","Meditate","Stretch","Screen Time","Supplements"];

    let DETAILS = {}, STREAKS = {}, SORT = "worst";  // "worst" | "fixed"

    function keyOf(dt){const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
    function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
    function lastDays(){const b=today0(),out=[];for(let i=DAYS-1;i>=0;i--){const dt=new Date(b);dt.setDate(b.getDate()-i);out.push(dt);}return out;}

    function demo(){
      const d={};
      lastDays().forEach((dt,i)=>{
        const det={}; HABIT_ORDER.forEach((n,j)=>det[n]=((i*3+j*5)%7)>1);
        if(i<DAYS-1) d[keyOf(dt)]=det;   // today unlogged, mirrors real usage
      });
      return d;
    }

    const tip=document.getElementById("tip");
    function bindTip(el,html){
      el.addEventListener("mouseenter",()=>{tip.innerHTML=html;tip.style.display="block";});
      el.addEventListener("mousemove",e=>{tip.style.left=(e.clientX+13)+"px";tip.style.top=(e.clientY-8)+"px";});
      el.addEventListener("mouseleave",()=>tip.style.display="none");
    }

    // Habits present in the window (union across logged days), in canonical order.
    function habitNames(dates){
      const seen=new Set();
      dates.forEach(dt=>{const det=DETAILS[keyOf(dt)]; if(det) Object.keys(det).forEach(h=>seen.add(h));});
      if(!seen.size) return HABIT_ORDER.slice();
      return HABIT_ORDER.filter(h=>seen.has(h)).concat([...seen].filter(h=>!HABIT_ORDER.includes(h)).sort());
    }

    // done / logged over the window. `logged` skips days with no entry, so an unlogged
    // today doesn't get counted as a miss and drag every rate down.
    function statsFor(name,dates){
      let done=0,logged=0;const marks=[];
      dates.forEach(dt=>{
        const det=DETAILS[keyOf(dt)];
        if(!det || !(name in det)){marks.push(null);return;}
        const on=!!det[name]; marks.push(on); logged++; if(on) done++;
      });
      return {done,logged,marks,rate:logged?Math.round(done/logged*100):null};
    }

    function rateClass(r){ if(r==null) return "na"; if(r>=85) return "good"; if(r>=55) return "mid"; return "bad"; }

    function render(){
      const dates=lastDays(), tkey=keyOf(today0());
      const rows=document.getElementById("rows"); rows.innerHTML="";

      const hdr=document.createElement("div"); hdr.className="row hdr";
      const hdrDays=dates.map(dt=>{
        const isT=keyOf(dt)===tkey;
        return `<div class="dl${isT?" is-today":""}">${dt.toLocaleDateString(undefined,{weekday:'narrow'})}</div>`;
      }).join("");
      hdr.innerHTML=`<span class="nm">HABIT</span><div class="days hdr-days">${hdrDays}</div><span class="rate">RATE</span>`;
      rows.appendChild(hdr);

      const names=habitNames(dates);
      const data=names.map(n=>({name:n,...statsFor(n,dates)}));

      const ordered = SORT==="worst"
        // unlogged habits sink to the bottom; ties keep canonical order (stable sort)
        ? data.slice().sort((a,b)=>(a.rate==null)-(b.rate==null) || a.rate-b.rate)
        : data;

      ordered.forEach(h=>{
        const row=document.createElement("div"); row.className="row";
        const cells=h.marks.map((m,i)=>{
          const isT=keyOf(dates[i])===tkey;
          const cls=m===null?"none":(m?"on":"off");
          return `<div class="d ${cls}${isT?" today":""}"></div>`;
        }).join("");
        const rtxt=h.rate==null?"—":h.rate+"%";
        row.innerHTML=`<span class="nm">${h.name}</span><div class="days">${cells}</div><span class="rate ${rateClass(h.rate)}">${rtxt}</span>`;

        const st=STREAKS[h.name];
        const streakTxt=(st!=null && st>0)?` · ${st}d streak`:"";
        bindTip(row,`<b>${h.name}</b> — ${h.rate==null?"no data":h.rate+"%"}<br><span class="s">${h.done}/${h.logged} logged days${streakTxt}</span>`);
        rows.appendChild(row);
      });

      const totDone=data.reduce((s,h)=>s+h.done,0), totLog=data.reduce((s,h)=>s+h.logged,0);
      document.getElementById("overall").innerHTML =
        totLog ? `7d overall <b>${Math.round(totDone/totLog*100)}%</b> · ${totDone}/${totLog}` : `7d overall <b>—</b>`;

      const scored=data.filter(h=>h.rate!=null);
      const weak=document.getElementById("weak");
      if(scored.length){
        const w=scored.reduce((a,b)=>b.rate<a.rate?b:a);
        weak.innerHTML = w.rate>=85 ? `all habits ≥85%` : `weakest <b>${w.name} ${w.rate}%</b>`;
      } else {
        weak.textContent="nothing logged this week";
      }
    }

    document.getElementById("sortBtn").addEventListener("click",()=>{
      SORT = SORT==="worst" ? "fixed" : "worst";
      document.getElementById("sortBtn").textContent = SORT==="worst" ? "worst first" : "fixed order";
      render();
    });

    function setStatus(txt,col){const el=document.getElementById("liveStatus");el.textContent=txt;if(col)el.style.color=col;}

    async function load(){
      try{
        const r=await fetch("./habits.json?t="+Date.now());
        if(!r.ok) throw new Error("no json");
        const j=await r.json();
        DETAILS=j.details||{}; STREAKS=j.streaks||{};
        render();
        const d=j.updated?new Date(j.updated*1000):new Date();
        setStatus("synced "+d.toLocaleDateString(),"rgba(74,222,128,0.35)");
      }catch{
        DETAILS=demo(); STREAKS={};
        render();
        setStatus("offline · seed data","rgba(255,255,255,0.15)");
      }
    }
    load();
    setInterval(load, REFRESH);
  </script>
</body>
</html>
